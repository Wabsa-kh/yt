name: Autonomous Clone Bot

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */4 * * *'

concurrency: 
  group: yt-uploader
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Dependencies
        # --upgrade is critical to fix the "reload" error
        run: pip install --upgrade yt-dlp yt-dlp-ejs google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Autocloner
        env:
          C1_CLIENT_ID: ${{ secrets.C1_CLIENT_ID }}
          C1_CLIENT_SECRET: ${{ secrets.C1_CLIENT_SECRET }}
          C1_REFRESH_TOKEN: ${{ secrets.C1_REFRESH_TOKEN }}
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          C2_REFRESH_TOKEN: ${{ secrets.C2_REFRESH_TOKEN }}
          C3_CLIENT_ID: ${{ secrets.C3_CLIENT_ID }}
          C3_CLIENT_SECRET: ${{ secrets.C3_CLIENT_SECRET }}
          C3_REFRESH_TOKEN: ${{ secrets.C3_REFRESH_TOKEN }}
        run: python main.py

      - name: Save memory
        run: |
          git config --global user.name "CloneBot-9000"
          git config --global user.email "bot@github.actions"
          
          # 1. Stage ONLY the memory files
          git add queues.json state.json uploaded.txt
          
          # 2. If there are changes to the memory files, commit them
          if ! git diff --staged --quiet; then
            git commit -m "🤖 Update Logs"
          fi
          
          # 3. CRITICAL FIX: Discard all other changes (like cookies.txt updates or leftover videos)
          git reset --hard
          
          # 4. Now it is 100% safe to pull and push!
          git pull --rebase origin main
          git pushpull --rebase origin main && git push)
