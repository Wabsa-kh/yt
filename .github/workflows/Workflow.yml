name: Autonomous Clone Bot

on:
  workflow_dispatch: # Allows manual testing
  schedule:
    - cron: '0 */4 * * *' # Runs every 4 hours

concurrency: 
  group: yt-uploader
  cancel-in-progress: false # Waits for the previous upload to finish before starting a new one

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write # ⚠️ CRITICAL: Allows the bot to push commits back to the repo

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0 # Fetches full history so git push works smoothly

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install Python Dependencies
        run: pip install yt-dlp yt-dlp-ejs google-api-python-client google-auth-oauthlib google-auth-httplib2

      - name: Run Autocloner
        env:
          C1_CLIENT_ID: ${{ secrets.C1_CLIENT_ID }}
          C1_CLIENT_SECRET: ${{ secrets.C1_CLIENT_SECRET }}
          C1_REFRESH_TOKEN: ${{ secrets.C1_REFRESH_TOKEN }}
          
          C2_CLIENT_ID: ${{ secrets.C2_CLIENT_ID }}
          C2_CLIENT_SECRET: ${{ secrets.C2_CLIENT_SECRET }}
          C2_REFRESH_TOKEN: ${{ secrets.C2_REFRESH_TOKEN }}
          
          C3_CLIENT_ID: ${{ secrets.C3_CLIENT_ID }}
          C3_CLIENT_SECRET: ${{ secrets.C3_CLIENT_SECRET }}
          C3_REFRESH_TOKEN: ${{ secrets.C3_REFRESH_TOKEN }}
        run: python main.py

      - name: Save memory (Commit changes back to GitHub)
        run: |
          git config --global user.name "CloneBot-9000"
          git config --global user.email "bot@github.actions"
          
          # Add all the memory files
          git add queue.txt uploaded.txt scanned_channels.txt
          
          # If changes exist, commit and push them
          git diff --quiet && git diff --staged --quiet || (git commit -m "🤖 Auto-updated queue, uploaded, and registry logs" && git pull --rebase && git push)
