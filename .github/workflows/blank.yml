name: Simple YouTube Downloader

on:
  workflow_dispatch: 

jobs:
  download_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # INSTALL FFMPEG AND NODEJS TOGETHER NATIVELY
      - name: Install System Dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg nodejs

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Run Downloader
        run: python downloader.py

      - name: Upload Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-video
          path: downloaded_video.*
          retention-days: 1
