jobs:
  download:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # CORRECTED WARP ACTION (Use v1.4 or latest)
      - name: Set up Cloudflare WARP
        uses: fscarmen/warp-on-actions@v1.4
        with:
          stack: dual        # Uses both IPv4 and IPv6 (Best for bypass)
          mode: client       # 'wireguard' was removed; use 'client'

      - name: Install yt-dlp
        run: pip install yt-dlp

      # IMPORTANT: You must tell yt-dlp to use the WARP proxy
      - name: Download Video
        run: |
          # WARP Client mode usually opens port 40000 or 1080
          # This action defaults to a SOCKS5 proxy on localhost:40000
          yt-dlp --proxy "socks5://127.0.0.1:40000" "https://www.youtube.com/watch?v=n3-qSfoJ7IM"
