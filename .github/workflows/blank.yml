name: Simple YouTube Downloader

on:
  workflow_dispatch: 

jobs:
  download_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      # 1. Install Deno (The officially recommended Javascript solver)
      - name: Install Deno
        run: |
          curl -fsSL https://deno.land/x/install/install.sh | sh
          echo "$HOME/.deno/bin" >> $GITHUB_PATH

      # 2. Install FFmpeg
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      # 3. Install yt-dlp AND the new EJS companion plugin
      - name: Install yt-dlp and EJS plugin
        run: pip install yt-dlp yt-dlp-ejs

      - name: Run Downloader
        run: python downloader.py

      - name: Upload Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-video
          path: downloaded_video.*
          retention-days: 1
