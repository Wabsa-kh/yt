name: YT-DLP Download with Tor
# This allows you to run it manually from the "Actions" tab
on: workflow_dispatch

jobs:
  download-video:
    runs-on: ubuntu-latest
    steps:
      # 1. Standard checkout (required)
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. Install Tor (The Proxy) directly from Ubuntu
      # This is better than a custom Action because it won't vanish.
      - name: Install and Start Tor
        run: |
          sudo apt-get update
          sudo apt-get install -y tor
          sudo service tor start
          # Wait a few seconds for Tor to connect
          sleep 10

      # 3. Install yt-dlp
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      # 4. Run the download using Tor Proxy (Port 9050)
      # REPLACE THE URL BELOW WITH YOUR VIDEO LINK
      - name: Download Video
        run: |
          yt-dlp --proxy "socks5://127.0.0.1:9050" -o "%(title)s.%(ext)s" "https://www.youtube.com/watch?v=dQw4w9WgXcQ"

      # 5. Upload the video so you can download it from GitHub
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: "*.webm" 
          # Note: If your video downloads as .mp4 or .mkv, change the *.webm above
