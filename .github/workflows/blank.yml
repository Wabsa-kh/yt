name: YT-DLP (Android Mode Fix)

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL'
        required: true
      cookies_content:
        description: 'Paste content of cookies.txt here'
        required: true
      format:
        description: 'Format'
        required: false
        default: 'bestvideo+bestaudio/best'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # FIX 1: Properly install Node.js (JavaScript Runtime)
      # This fixes the "No supported JavaScript runtime" warning
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # We install the master branch of yt-dlp to get the absolute latest fixes
          pip install https://github.com/yt-dlp/yt-dlp/archive/master.zip

      - name: Create Cookie File
        env:
          RAW_COOKIES: ${{ inputs.cookies_content }}
        run: |
          # Write cookies to file
          echo "$RAW_COOKIES" > cookies.txt
          
          # Fix line endings (Windows CRLF -> Linux LF)
          sed -i 's/\r$//' cookies.txt

          # Ensure Netscape Header exists
          if ! grep -q "# Netscape" cookies.txt; then
             sed -i '1s/^/# Netscape HTTP Cookie File\n/' cookies.txt
          fi

      - name: Download Video
        run: |
          mkdir downloads
          
          # FIX 2: Use "android" player client to bypass "Sign in" check
          # FIX 3: Add --verbose to see detailed errors if it fails
          yt-dlp "${{ inputs.video_url }}" \
            --verbose \
            -f "${{ inputs.format }}" \
            -o "downloads/%(title)s.%(ext)s" \
            --merge-output-format mp4 \
            --cookies cookies.txt \
            --extractor-args "youtube:player_client=android" \
            --user-agent "Mozilla/5.0 (Linux; Android 10; K) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Mobile Safari/537.36"

      - name: Cleanup Cookies
        if: always()
        run: rm -f cookies.txt

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
          retention-days: 1
