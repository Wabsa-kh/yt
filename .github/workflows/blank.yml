name: YT-DLP Downloader

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'The URL of the video to download'
        required: true
      format:
        description: 'Format (default: best video+audio)'
        required: false
        default: 'bestvideo+bestaudio/best'

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          pip install yt-dlp

      - name: Download Video
        run: |
          mkdir downloads
          # -o defines output location and filename template
          # --merge-output-format mp4 ensures the final container is MP4 (if possible)
          yt-dlp "${{ inputs.video_url }}" \
            -f "${{ inputs.format }}" \
            -o "downloads/%(title)s.%(ext)s" \
            --merge-output-format mp4

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: downloads/
          retention-days: 1
