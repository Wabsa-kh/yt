name: Simple YouTube Downloader

on:
  workflow_dispatch: # This allows you to click a button to run the action

jobs:
  download_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg (Required for combining video/audio)
        run: sudo apt-get update && sudo apt-get install ffmpeg -y

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Reconstruct Cookies
        env:
          YOUTUBE_COOKIES: ${{ secrets.YOUTUBE_COOKIES }}
        run: |
          # Decodes the Base64 string safely back into the cookies.txt file
          echo "$YOUTUBE_COOKIES" | base64 --decode > cookies.txt

      - name: Run Downloader
        run: python downloader.py

      - name: Upload Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-video
          path: downloaded_video.mp4
          retention-days: 1 # Keeps the file on GitHub for 1 day
