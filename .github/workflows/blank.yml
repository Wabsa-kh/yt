name: YT-DLP Download with Tor (Fixed)
on: workflow_dispatch

jobs:
  download-video:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # 1. Install Tor AND FFmpeg (Fixes quality warning)
      - name: Install Tor and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y tor ffmpeg
          sudo service tor start
          sleep 10

      # 2. Install yt-dlp
      - name: Install yt-dlp
        run: |
          python3 -m pip install --upgrade pip
          pip install yt-dlp

      # 3. Download Video
      # We force the filename to "my_video" so the uploader always finds it
      - name: Download Video
        run: |
          yt-dlp --proxy "socks5://127.0.0.1:9050" -o "my_video.%(ext)s" "YOUR_VIDEO_URL_HERE"

      # 4. Upload Result
      # We use 'my_video.*' so it works for .mp4, .mkv, or .webm automatically
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-video
          path: my_video.*
