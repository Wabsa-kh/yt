name: YouTube Auto Uploader (Tor + Resumable)

on:
  schedule:
    - cron: "0 */4 * * *" # Runs every 4 hours
  workflow_dispatch:      # Allows manual "Run Workflow" button

permissions:
  contents: write         # Required to save state files back to repo

jobs:
  run_bot:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tor ffmpeg
          sudo service tor start
          # Wait for Tor to establish a circuit
          sleep 10

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install google-api-python-client google-auth yt-dlp requests python-dateutil

      - name: Setup YouTube Cookies
        # Takes the secret and writes it to a file the script can read
        run: echo "${{ secrets.YT_COOKIES }}" > cookies.txt

      - name: Run Automation Script
        env:
          # Map your GitHub Secrets to Environment Variables
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          SOURCE_CHANNEL_ID: ${{ secrets.SOURCE_CHANNEL_ID }}
        run: python main.py

      - name: Commit and Push State Changes
        if: always() # Run even if the script fails, to save progress
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          
          # Only add state files, avoid adding sensitive cookies or video files
          git add state/*.json
          
          # Commit only if there are changes to avoid erroring out
          git commit -m "chore: update upload state [skip ci]" || echo "No changes to commit"
          
          git push
