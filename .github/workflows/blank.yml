name: YT-DLP Ultimate Fix

on:
  workflow_dispatch:
    inputs:
      video_url:
        description: 'Video URL'
        required: true
      cookies_content:
        description: 'Paste content of cookies.txt'
        required: true

jobs:
  download:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11' # Using 3.11 for better stability with yt-dlp

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg
          python -m pip install --upgrade pip
          # Force install the latest development version which has the newest bypasses
          pip install https://github.com/yt-dlp/yt-dlp/archive/master.zip

      - name: Create Cookie File
        run: |
          cat <<EOF > cookies.txt
          ${{ inputs.cookies_content }}
          EOF
          
          # Force Netscape header and clean whitespace
          sed -i 's/\r$//' cookies.txt
          if ! grep -q "# Netscape" cookies.txt; then
             echo -e "# Netscape HTTP Cookie File\n$(cat cookies.txt)" > cookies.txt
          fi

      - name: Download Video
        run: |
          mkdir downloads
          
          # 1. We force the use of the iOS client (ios is currently harder for YT to block)
          # 2. We explicitly tell yt-dlp to use 'node' as the javascript runtime
          # 3. We use a real iPhone User-Agent
          
          yt-dlp "${{ inputs.video_url }}" \
            --verbose \
            --cookies cookies.txt \
            --js-runtimes node \
            --extractor-args "youtube:player_client=ios,android;player_skip=web" \
            --user-agent "Mozilla/5.0 (iPhone; CPU iPhone OS 17_4_1 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.4.1 Mobile/15E148 Safari/604.1" \
            -f "bestvideo+bestaudio/best" \
            --merge-output-format mp4 \
            -o "downloads/%(title)s.%(ext)s"

      - name: Upload Artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: video-output
          path: downloads/
          retention-days: 1

      - name: Cleanup
        if: always()
        run: rm -f cookies.txt
