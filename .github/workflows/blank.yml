name: Simple YouTube Downloader

on:
  workflow_dispatch: 

jobs:
  download_test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install ffmpeg -y

      - name: Install yt-dlp
        run: pip install yt-dlp

      # The checkout step above already brings cookies.txt into the runner,
      # so we don't need any decoding steps here anymore!

      - name: Run Downloader
        run: python downloader.py

      - name: Upload Video to GitHub Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: my-downloaded-video
          path: downloaded_video.mp4
          retention-days: 1
